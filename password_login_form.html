<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.5">
  <title>Password Login Autofill Test</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <h1>Password Autofill — Login</h1>
  <p class="hint">Focus the fields to test saved-credential suggestions.</p>

  <form id="login_form" name="login" action="destination.html" method="post" autocomplete="on">
    <label for="login_username">
      Email or username
      <input
        id="login_username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        placeholder="user@example.com"
        required
      >
    </label>

    <label for="login_password">
      Password
      <input
        id="login_password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Password"
        required
      >
    </label>

    <div class="actions">
      <input type="reset" value="Reset">
      <input id="submit_login" type="submit" value="Sign in">
    </div>
  </form>

  <script>
    document.getElementById("login_form").addEventListener("submit", (event) => {
      event.preventDefault();
      window.parent.postMessage({ type: "autofill-test-submit", flow: "login" }, window.location.origin);
      window.location.assign("destination.html?flow=login");
    });
  </script>
</body>
</html>
