<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Card Autofill Test</title>
  <link rel="stylesheet" href="shell.css?v=20260914-2">
</head>
<body>
  <main>
    <header class="site-header">
      <a class="brand" href="index.html"><span aria-hidden="true">AF</span>Autofill Lab</a>
      <nav aria-label="Autofill test forms">
        <a href="profile.html">Profile</a>
        <a href="password.html">Passwords</a>
        <a href="card.html" aria-current="page">Cards</a>
      </nav>
    </header>
    <section class="page-intro">
      <p class="kicker">03 · Payment</p>
      <h1>Банковская карта</h1>
      <p>Проверка карточного Autofill и предложения сохранить новый способ оплаты.</p>
    </section>

    <div class="form-container">
      <iframe
        class="card-frame"
        id="card-form-iframe"
        src="card_form.html?v=20260914-4"
        title="Payment card autofill test form"
        sandbox="allow-scripts allow-forms allow-same-origin"
      ></iframe>
    </div>

    <span id="submit-status" class="status" role="status" aria-live="polite">
      Подготавливаю безопасную отправку формы…
    </span>
  </main>

  <script>
    const iframe = document.getElementById("card-form-iframe");
    const status = document.getElementById("submit-status");
    let useLocalSubmitFallback = !("serviceWorker" in navigator);

    function enableLocalSubmitFallback() {
      useLocalSubmitFallback = true;
      iframe.contentWindow?.postMessage({ type: "autofill-card-fallback" }, window.location.origin);
    }

    iframe.addEventListener("load", () => {
      if (useLocalSubmitFallback) enableLocalSubmitFallback();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("card-submit-sw.js")
        .then(() => navigator.serviceWorker.ready)
        .then(() => {
          status.textContent = "Используйте только тестовые карточные данные";
        })
        .catch(() => {
          enableLocalSubmitFallback();
          status.textContent = "Обычный submit без Service Worker";
        });
    } else {
      status.textContent = "Обычный submit без Service Worker";
    }

    navigator.serviceWorker?.addEventListener("message", (event) => {
      if (event.data?.type === "autofill-test-submit") {
        status.textContent = "Submit распознан: payment card";
      }
    });

    window.addEventListener("message", (event) => {
      if (event.origin === window.location.origin && event.data?.type === "autofill-test-submit" && event.data.fallback) {
        status.textContent = "Submit выполнен: payment card";
      }
    });
  </script>
</body>
</html>
