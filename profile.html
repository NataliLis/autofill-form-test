<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Autofill Test</title>
  <link rel="stylesheet" href="shell.css?v=20260914-2">
</head>
<body>
  <main>
    <header class="site-header">
      <a class="brand" href="index.html"><span aria-hidden="true">AF</span>Autofill Lab</a>
      <nav aria-label="Autofill test forms">
        <a href="profile.html" aria-current="page">Profile</a>
        <a href="password.html">Passwords</a>
        <a href="card.html">Cards</a>
      </nav>
    </header>
    <section class="page-intro">
      <p class="kicker">01 · Profile</p>
      <h1>Профиль и адрес</h1>
      <p>Проверка распознавания контактных данных и сохранения нового профиля.</p>
    </section>
    <div class="form-container">
      <iframe class="profile-frame" id="address-form-iframe" src="autofill_smoke_test.html" title="Profile autofill test form" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
    </div>
    <div class="submit-row">
      <button id="do-xhr-submit" type="button">XHR Submit</button>
      <span id="submit-status" class="status" role="status" aria-live="polite">Заполните поля вручную</span>
    </div>
  </main>
  <script>
    const xhrButton = document.getElementById("do-xhr-submit");
    const status = document.getElementById("submit-status");
    xhrButton.addEventListener("click", () => {
      const form = document.getElementById("address-form-iframe").contentDocument?.forms[0];
      if (!form) { status.textContent = "Форма уже отправлена"; return; }
      if (!form.reportValidity()) { status.textContent = "Заполните все поля"; return; }
      form.remove();
      status.textContent = "XHR Submit выполнен — форма удалена из iframe";
      xhrButton.disabled = true;
    });
  </script>
</body>
</html>
