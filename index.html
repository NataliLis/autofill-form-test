<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XHR Autofill Test</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      color: light-dark(#171717, #f4f4f5);
      background: light-dark(#f5f5f7, #09090b);
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .form-container {
      overflow: hidden;
      border: 1px solid light-dark(#d4d4d8, #3f3f46);
      border-radius: 16px;
      background: light-dark(#ffffff, #18181b);
    }

    iframe {
      display: block;
      width: 100%;
      height: 590px;
      border: 0;
      background: light-dark(#ffffff, #18181b);
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 14px;
    }

    #do-xhr-submit {
      min-height: 46px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      background: #2563eb;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #do-xhr-submit:disabled {
      cursor: default;
      opacity: 0.55;
    }

    #submit-status {
      color: light-dark(#64646f, #a1a1aa);
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .form-container {
        border: 0;
        border-radius: 0;
      }

      .submit-row {
        padding: 14px 16px 20px;
      }

      #do-xhr-submit {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="form-container">
      <iframe
        id="address-form-iframe"
        src="autofill_smoke_test.html"
        title="Profile Autofill test form"
        sandbox="allow-scripts allow-forms allow-same-origin"
      ></iframe>
    </div>

    <div class="submit-row">
      <button id="do-xhr-submit" type="button">
        XHR Submit
      </button>

      <span id="submit-status" role="status" aria-live="polite">
        Заполните поля вручную
      </span>
    </div>
  </main>

  <script>
    const xhrButton = document.getElementById("do-xhr-submit");
    const status = document.getElementById("submit-status");

    xhrButton.addEventListener("click", () => {
      const iframeDocument = document.getElementById("address-form-iframe").contentDocument;
      const form = iframeDocument?.forms[0];

      if (!form) {
        status.textContent = "Форма уже отправлена";
        return;
      }

      if (!form.reportValidity()) {
        status.textContent = "Заполните все поля";
        return;
      }

      // Имитирует XHR-сабмит из оригинальной тестовой страницы:
      // форма удаляется внутри дочернего iframe.
      form.remove();

      status.textContent =
        "XHR Submit выполнен — форма удалена из iframe";

      xhrButton.disabled = true;
    });
  </script>
</body>
</html>
