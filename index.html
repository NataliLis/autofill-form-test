<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XHR Autofill Test</title>

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      color: light-dark(#171717, #f4f4f5);
      background: light-dark(#f5f5f7, #09090b);
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .form-container {
      overflow: hidden;
      border: 1px solid light-dark(#d4d4d8, #3f3f46);
      border-radius: 16px;
      background: light-dark(#ffffff, #18181b);
      padding: 20px;
    }

    h3 {
      margin: 0 0 18px;
      font-size: 20px;
      font-weight: 600;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 9px 11px;
      border: 1px solid light-dark(#c7c7cc, #52525b);
      border-radius: 10px;
      color: inherit;
      background: light-dark(#ffffff, #27272a);
      font: inherit;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    input[type="reset"],
    input[type="submit"] {
      border: 0;
      font-weight: 600;
      cursor: pointer;
    }

    input[type="reset"] {
      background: light-dark(#e5e7eb, #3f3f46);
    }

    input[type="submit"] {
      color: #ffffff;
      background: #2563eb;
    }

    .submit-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 14px;
    }

    #do-xhr-submit {
      min-height: 46px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      color: #ffffff;
      background: #2563eb;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #do-xhr-submit:disabled {
      cursor: default;
      opacity: 0.55;
    }

    #submit-status {
      color: light-dark(#64646f, #a1a1aa);
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
      }

      .form-container {
        border: 0;
        border-radius: 0;
        padding: 16px;
      }

      .submit-row {
        padding: 14px 16px 20px;
      }

      #do-xhr-submit {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="form-container">
      <h3>Profile Autofill</h3>

      <form
        name="addr1.1"
        id="profile_form"
        action="destination.html"
        method="post"
        autocomplete="on"
      >
        <label for="form_name">
          Full Name
          <input
            type="text"
            name="name"
            id="form_name"
            autocomplete="name"
            placeholder="George Washington"
            required
          >
        </label>

        <label for="form_organization">
          Organization
          <input
            type="text"
            name="organization"
            id="form_organization"
            autocomplete="organization"
            placeholder="Acme Inc."
          >
        </label>

        <label for="form_address">
          Street Address
          <input
            type="text"
            name="address-line1"
            id="form_address"
            autocomplete="address-line1"
            placeholder="1600 Pennsylvania Ave NW"
            required
          >
        </label>

        <label for="form_city">
          City
          <input
            type="text"
            name="address-level2"
            id="form_city"
            autocomplete="address-level2"
            placeholder="Washington"
            required
          >
        </label>

        <label for="form_state">
          State
          <select
            name="address-level1"
            id="form_state"
            autocomplete="address-level1"
            required
          >
            <option value="">Select state</option>
            <option value="CA">California</option>
            <option value="MA">Massachusetts</option>
            <option value="NY">New York</option>
            <option value="MD">Maryland</option>
            <option value="OR">Oregon</option>
            <option value="OH">Ohio</option>
            <option value="IL">Illinois</option>
            <option value="DC">District of Columbia</option>
          </select>
        </label>

        <label for="form_zip">
          ZIP Code
          <input
            type="text"
            name="postal-code"
            id="form_zip"
            autocomplete="postal-code"
            inputmode="numeric"
            placeholder="20500"
            required
          >
        </label>

        <label for="form_country">
          Country
          <input
            type="text"
            name="country-name"
            id="form_country"
            autocomplete="country-name"
            placeholder="United States"
            value="US"
          >
        </label>

        <label for="form_email">
          Email
          <input
            type="email"
            name="email"
            id="form_email"
            autocomplete="email"
            placeholder="email+1@example.com"
            required
          >
        </label>

        <label for="form_phone">
          Phone
          <input
            type="tel"
            name="tel"
            id="form_phone"
            autocomplete="tel-national"
            placeholder="+1 (202) 555-0100"
            required
          >
        </label>

        <div class="actions">
          <input type="reset" value="Reset">

          <input
            id="submit_profile"
            type="submit"
            value="Submit Profile"
          >
        </div>
      </form>
    </div>

    <div class="submit-row">
      <button id="do-xhr-submit" type="button">
        XHR Submit
      </button>

      <span id="submit-status" role="status" aria-live="polite">
        Заполните поля вручную
      </span>
    </div>
  </main>

  <script>
    const xhrButton = document.getElementById("do-xhr-submit");
    const status = document.getElementById("submit-status");
    const form = document.forms[0];

    xhrButton.addEventListener("click", () => {
      if (!form) {
        status.textContent = "Форма уже отправлена";
        return;
      }

      if (!form.reportValidity()) {
        status.textContent = "Заполните все поля";
        return;
      }

      // Имитирует XHR-сабмит из оригинальной тестовой страницы:
      // форма удаляется
      form.remove();

      status.textContent =
        "XHR Submit выполнен — форма удалена";

      xhrButton.disabled = true;
    });

    // Предотвращаем отправку формы через Submit Profile
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      if (!form.reportValidity()) {
        return;
      }
      
      status.textContent = "Используйте кнопку XHR Submit";
    });
  </script>
</body>
</html>
