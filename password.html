<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Autofill Test</title>
  <link rel="stylesheet" href="shell.css?v=20260914-2">
</head>
<body>
  <main>
    <header class="site-header">
      <a class="brand" href="index.html"><span aria-hidden="true">AF</span>Autofill Lab</a>
      <nav aria-label="Autofill test forms">
        <a href="profile.html">Profile</a>
        <a href="password.html" aria-current="page">Passwords</a>
        <a href="card.html">Cards</a>
      </nav>
    </header>
    <section class="page-intro">
      <p class="kicker">02 · Passwords</p>
      <h1>Пароли</h1>
      <p>Два отдельных сценария для сохранённых credentials и нового пароля.</p>
    </section>

    <div class="mode-switcher" aria-label="Password flow">
      <button id="show-login" type="button" aria-pressed="true">Login</button>
      <button id="show-signup" type="button" aria-pressed="false">Sign up</button>
    </div>

    <div class="form-container">
      <iframe
        class="password-frame"
        id="password-form-iframe"
        src="password_login_form.html"
        title="Password login autofill test form"
        sandbox="allow-scripts allow-forms allow-same-origin"
      ></iframe>
    </div>

    <span id="submit-status" class="status" role="status" aria-live="polite">
      Login: username + current-password
    </span>
  </main>

  <script>
    const iframe = document.getElementById("password-form-iframe");
    const loginButton = document.getElementById("show-login");
    const signupButton = document.getElementById("show-signup");
    const status = document.getElementById("submit-status");

    function selectMode(mode) {
      const isLogin = mode === "login";
      iframe.src = isLogin ? "password_login_form.html" : "password_signup_form.html";
      iframe.title = isLogin
        ? "Password login autofill test form"
        : "Password sign-up autofill test form";
      loginButton.setAttribute("aria-pressed", String(isLogin));
      signupButton.setAttribute("aria-pressed", String(!isLogin));
      status.textContent = isLogin
        ? "Login: username + current-password"
        : "Sign up: username + new-password";
    }

    loginButton.addEventListener("click", () => selectMode("login"));
    signupButton.addEventListener("click", () => selectMode("signup"));

    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin || event.source !== iframe.contentWindow) return;
      if (event.data?.type === "autofill-test-submit") {
        status.textContent = `Submit распознан: ${event.data.flow}`;
      }
    });
  </script>
</body>
</html>
