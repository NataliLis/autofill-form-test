<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.5">
  <title>Password Sign-up Autofill Test</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <h1>Password Autofill — Sign up</h1>
  <p class="hint">Use test credentials. A successful submit navigates only inside this iframe.</p>

  <form id="signup_form" name="signup" action="destination.html" method="post" autocomplete="on">
    <label for="signup_username">
      Email
      <input
        id="signup_username"
        name="username"
        type="email"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        placeholder="new-user@example.com"
        required
      >
    </label>

    <label for="signup_password">
      New password
      <input
        id="signup_password"
        name="new-password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >
    </label>

    <label for="signup_password_confirmation">
      Confirm new password
      <input
        id="signup_password_confirmation"
        name="new-password-confirmation"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="Repeat password"
        required
      >
    </label>

    <div class="actions">
      <input type="reset" value="Reset">
      <input id="submit_signup" type="submit" value="Create account">
    </div>
  </form>

  <script>
    const form = document.getElementById("signup_form");
    const password = document.getElementById("signup_password");
    const confirmation = document.getElementById("signup_password_confirmation");

    confirmation.addEventListener("input", () => {
      confirmation.setCustomValidity("");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      confirmation.setCustomValidity(password.value === confirmation.value ? "" : "Passwords do not match");
      if (!form.reportValidity()) return;
      window.parent.postMessage({ type: "autofill-test-submit", flow: "sign-up" }, window.location.origin);
      window.location.assign("destination.html?flow=sign-up");
    });
  </script>
</body>
</html>
