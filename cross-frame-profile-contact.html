<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-frame Profile Contact Fields</title>
  <link rel="stylesheet" href="cross-frame-fields.css?v=20261005-1">
</head>
<body>
  <label for="cross-frame-street-address">
    Адрес
    <input
      id="cross-frame-street-address"
      type="text"
      name="street-address"
      autocomplete="section-profile street-address"
    >
  </label>

  <label for="cross-frame-city">
    Город
    <input
      id="cross-frame-city"
      type="text"
      name="address-level2"
      autocomplete="section-profile address-level2"
    >
  </label>

  <label for="cross-frame-country">
    Страна
    <input
      id="cross-frame-country"
      type="text"
      name="country-name"
      autocomplete="section-profile country-name"
    >
  </label>

  <label for="cross-frame-postal-code">
    Индекс
    <input
      id="cross-frame-postal-code"
      type="text"
      name="postal-code"
      autocomplete="section-profile postal-code"
    >
  </label>

  <label for="cross-frame-tel">
    Телефон
    <input
      id="cross-frame-tel"
      type="tel"
      name="tel"
      autocomplete="section-profile tel"
    >
  </label>

  <label for="cross-frame-email">
    Email
    <input
      id="cross-frame-email"
      type="email"
      name="email"
      autocomplete="section-profile email"
      autocapitalize="none"
      spellcheck="false"
    >
  </label>
</body>
</html>
