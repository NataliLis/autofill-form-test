<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-frame Profile Contact Fields</title>
  <link rel="stylesheet" href="cross-frame-fields.css?v=20261005-1">
</head>
<body>
  <label for="cross-frame-tel">
    Телефон
    <input
      id="cross-frame-tel"
      type="tel"
      name="tel"
      autocomplete="section-profile tel"
    >
  </label>

  <label for="cross-frame-email">
    Email
    <input
      id="cross-frame-email"
      type="email"
      name="email"
      autocomplete="section-profile email"
      autocapitalize="none"
      spellcheck="false"
    >
  </label>
</body>
</html>
